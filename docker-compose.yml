services:
  ugc-scraper:
    build: .
    container_name: ugc-scraper
    restart: unless-stopped
    init: true
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - TZ=Europe/Paris
      - GOOGLE_CALENDAR_PLANNING_ICS=/app/output/planned_screenings.ics
      - UGC_OUTPUT_JSON=/app/output/ugc_output.json
      - UGC_DB_PATH=/app/output/ugc_stats.db
      - UGC_SESSION_FILE=/app/.ugc_session.json
    volumes:
      # Session Playwright persistée (login UGC)
      - ./.ugc_session.json:/app/.ugc_session.json
      # Configuration du planner (modifiable depuis l'interface web)
      - ./planner_config.json:/app/planner_config.json
      # Sortie ICS + JSON
      - ./output:/app/output
